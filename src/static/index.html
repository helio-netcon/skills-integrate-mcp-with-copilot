<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <div class="header-spacer"></div>
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="user-menu">
          <button id="user-button" class="user-button" type="button" aria-label="Teacher login">👤</button>
          <span id="user-status" class="user-status">Guest</span>
        </div>
      </div>
      <div id="login-modal" class="modal hidden" aria-live="polite">
        <div class="modal-content">
          <h3>Teacher Login</h3>
          <form id="login-form">
            <div class="form-group">
              <label for="teacher-username">Username</label>
              <input id="teacher-username" name="username" type="text" required />
            </div>
            <div class="form-group">
              <label for="teacher-password">Password</label>
              <input id="teacher-password" name="password" type="password" required />
            </div>
            <div class="modal-actions">
              <button type="submit">Log In</button>
              <button id="logout-button" type="button" class="secondary-button">Log Out</button>
            </div>
          </form>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
